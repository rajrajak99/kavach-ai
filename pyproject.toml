[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopatch-ai"
version = "1.0.0"
description = "Autonomous Zero-Noise Pull Request Security Inspector & 1-Click Surgical Patcher"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "rajrajak99", email = "rajrajak99@users.noreply.github.com"}
]
keywords = ["security", "code-review", "git", "diff", "cwe", "ast", "cli", "devsecops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "requests>=2.28.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/rajrajak99/autopatch-ai"
Repository = "https://github.com/rajrajak99/autopatch-ai"
"Bug Tracker" = "https://github.com/rajrajak99/autopatch-ai/issues"

[project.scripts]
autopatch = "cli:main"
autopatch-ci = "ci_bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "samples*"]

[tool.setuptools]
py-modules = ["cli", "ci_bot"]
