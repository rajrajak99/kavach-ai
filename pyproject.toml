[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kavach-ai"
version = "1.4.1"
description = "Autonomous Zero-Noise Code Security Inspector & 1-Click Surgical Patcher"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "PolyForm-Noncommercial-1.0.0"}
authors = [
    {name = "Raja Rajak (@rajrajak99)", email = "rajabhaiyarajak2008@gmail.com"}
]
keywords = ["security", "code-review", "git", "diff", "cwe", "ast", "cli", "devsecops", "self-healing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance"
]
dependencies = [
    "requests>=2.28.0",
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
ui = ["streamlit>=1.35.0", "pandas>=2.0.0"]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://kavach-ai.streamlit.app"
Repository = "https://github.com/rajrajak99/kavach-ai"
"Bug Tracker" = "https://github.com/rajrajak99/kavach-ai/issues"

[project.scripts]
kavach = "cli:main"
kavach-ci = "ci_bot:main"
autopatch = "cli:main"
autopatch-ci = "ci_bot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.setuptools]
py-modules = ["cli", "ci_bot", "kavach_license"]
