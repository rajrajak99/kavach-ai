name: Kavach AI PR Security Gate

on:
  pull_request:
    branches: [ main, master, dev ]
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  kavach-security-audit:
    name: Zero-Noise AST Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kavach AI Engine
        run: pip install git+https://github.com/rajrajak99/kavach-ai.git

      - name: Inspect Changeset & Post 1-Click Fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kavach-ci --fail-on CRITICAL --heal --test-cmd pytest
