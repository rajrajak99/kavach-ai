name: 'AutoPatch AI PR Security Inspector'
description: 'Autonomous zero-noise pull request security reviewer and 1-click surgical patch generator'
author: 'rajrajak99'
inputs:
  github-token:
    description: 'GitHub Token for posting PR review comments'
    required: false
    default: ''
  scan-path:
    description: 'Path or directory to inspect (default: entire repo)'
    required: false
    default: '.'
  fail-on:
    description: 'Severity threshold to block merge (CRITICAL, HIGH, ALL, NONE)'
    required: false
    default: 'CRITICAL'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run AutoPatch CI Bot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        python ci_bot.py --path "${{ inputs.scan-path }}" --fail-on "${{ inputs.fail-on }}"
branding:
  icon: 'shield'
  color: 'blue'
