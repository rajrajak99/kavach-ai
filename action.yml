name: '🛡️ Kavach AI - Autonomous PR Security Gate'
description: 'Autonomous zero-noise PR security reviewer, self-healing test runner, and 1-click surgical patcher'
author: 'Raja Rajak (@rajrajak99)'
inputs:
  github-token:
    description: 'GitHub Token for posting PR review comments with 1-click suggestions'
    required: false
    default: ''
  scan-path:
    description: 'Path or directory to inspect (default: entire repo)'
    required: false
    default: '.'
  fail-on:
    description: 'Severity threshold to block PR merge (CRITICAL, HIGH, ALL, NONE)'
    required: false
    default: 'CRITICAL'
  heal:
    description: 'Run self-healing regression test verification on patches'
    required: false
    default: 'true'
  test-cmd:
    description: 'Test command to execute for regression safety (e.g. pytest, npm test)'
    required: false
    default: 'pytest'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Kavach AI CI Gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_SCAN_PATH: ${{ inputs.scan-path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_HEAL: ${{ inputs.heal }}
        INPUT_TEST_CMD: ${{ inputs.test-cmd }}
      run: |
        HEAL_ARGS=()
        if [ "$INPUT_HEAL" = "true" ]; then
          HEAL_ARGS=(--heal --test-cmd "$INPUT_TEST_CMD")
        fi
        python "${{ github.action_path }}/ci_bot.py" --path "$INPUT_SCAN_PATH" --fail-on "$INPUT_FAIL_ON" "${HEAL_ARGS[@]}"
branding:
  icon: 'shield'
  color: 'blue'
