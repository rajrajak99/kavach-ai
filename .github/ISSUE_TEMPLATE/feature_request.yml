name: 💡 Feature Request
description: Suggest an idea or architectural improvement for Kavach AI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Kavach AI better! We welcome ideas that improve scanning throughput, reduce noise, or expand self-healing capabilities.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is.
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you would like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you have considered
      description: Any alternative solutions or features you considered.
